name: Build APK and companion

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'img/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'img/**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Fetch native dependencies
        run: git submodule update --init --recursive --jobs 8 --depth 1
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"'
      - name: Build pull request with upstream test key
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-daemon :lorie-app:assembleStandaloneDebug :shell-loader:buildCompanionPackage
      - name: Build with private signing key
        if: github.event_name != 'pull_request'
        env:
          X11_KEYSTORE_BASE64: ${{ secrets.X11_KEYSTORE_BASE64 }}
          X11_KEYSTORE_PASSWORD: ${{ secrets.X11_KEYSTORE_PASSWORD }}
          X11_KEY_ALIAS: ${{ secrets.X11_KEY_ALIAS }}
          X11_KEY_PASSWORD: ${{ secrets.X11_KEY_PASSWORD }}
          X11_REQUIRE_SIGNING: 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in X11_KEYSTORE_BASE64 X11_KEYSTORE_PASSWORD X11_KEY_ALIAS X11_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          signing_dir="$RUNNER_TEMP/x11-signing"
          mkdir -m 700 -p "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          export X11_KEYSTORE_PATH="$signing_dir/termux-x11.p12"
          umask 077
          printf '%s' "$X11_KEYSTORE_BASE64" | base64 --decode > "$X11_KEYSTORE_PATH"
          unset X11_KEYSTORE_BASE64
          ./gradlew --no-daemon :lorie-app:assembleStandaloneDebug :shell-loader:buildCompanionPackage
      - name: Verify APK and record build identity
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SIGNING_MODE: ${{ github.event_name == 'pull_request' && 'upstream-test-key' || 'lyfcom-private-key' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp lorie-app/build/outputs/apk/standalone/debug/termux-x11-universal-debug.apk artifacts/
          cp shell-loader/build/outputs/companion/*.deb artifacts/
          cp shell-loader/build/outputs/companion/*.pkg.tar.xz artifacts/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/apk-signature.txt
          cat artifacts/apk-signature.txt
          if [[ "$SIGNING_MODE" == lyfcom-private-key ]]; then
            expected=fec755e66ac8b1036d464051514e9dfb0a5ebe0f85f824a210d170ca1658d839
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifacts/apk-signature.txt)
            [[ "$actual" == "$expected" ]] || { echo '::error::Unexpected APK signing certificate'; exit 1; }
          fi
          printf 'commit=%s\nsigning=%s\n' "$BUILD_COMMIT" "$SIGNING_MODE" > artifacts/build-info.txt
          (cd artifacts && sha256sum *.apk *.deb *.pkg.tar.xz > SHA256SUMS)
          cat artifacts/build-info.txt >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and matching companion packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: termux-x11-${{ github.event_name == 'pull_request' && 'test-key' || 'signed' }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
